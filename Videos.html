<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>全部影像 — Ye Lin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+JP:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet" />

<style>
  :root{
    --paper: #ffffff;
    --paper-2: #ededea;
    --ink: #141413;
    --ink-soft: #2b2a27;
    --muted: #8a857c;
    --hair: rgba(20,20,19,0.14);
    --hair-strong: rgba(20,20,19,0.45);
    --serif-en: "EB Garamond", "Source Serif 4", Georgia, serif;
    --serif-zh: "Noto Serif SC", "Songti SC", "STSong", serif;
    --serif-ja: "Noto Serif JP", "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif-zh), var(--serif-en);
    -webkit-font-smoothing: antialiased;
  }
  body[data-lang="en"]{ font-family: var(--serif-en), var(--serif-zh); }
  body[data-lang="ja"]{ --serif-zh: var(--serif-ja); font-family: var(--serif-ja), var(--serif-en); }
  body[data-lang="zh"] [data-en], body[data-lang="zh"] [data-ja]{ display: none !important; }
  body[data-lang="en"] [data-zh], body[data-lang="en"] [data-ja]{ display: none !important; }
  body[data-lang="ja"] [data-zh], body[data-lang="ja"] [data-en]{ display: none !important; }

  a{ color: inherit; text-decoration: none; }
  a.under{
    background-image: linear-gradient(currentColor,currentColor);
    background-size: 100% 1px; background-repeat: no-repeat; background-position: 0 100%;
    padding-bottom: 2px; transition: background-size 0.4s ease;
  }
  a.under:hover{ background-size: 0% 1px; background-position: 100% 100%; }

  .wrap{ max-width: 1240px; margin: 0 auto; padding: 0 56px; }
  @media (max-width: 720px){ .wrap{ padding: 0 24px; } }

  header.site{
    position: sticky; top: 0; z-index: 5;
    background: var(--paper); border-bottom: 1px solid var(--hair);
  }
  header.site .row{
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 22px 0 18px;
  }
  .logo{
    font-family: var(--serif-en); font-style: italic;
    font-size: 22px; letter-spacing: 0.01em; white-space: nowrap;
  }
  .logo .zh{ font-family: var(--serif-zh); font-style: normal; margin-right: 10px; }
  nav.primary{
    display: flex; gap: 28px; align-items: baseline;
    font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-soft);
  }
  nav.primary a{ position: relative; }
  nav.primary a::after{
    content:""; position:absolute; left:0; right:100%; bottom:-6px;
    height:1px; background: currentColor; transition: right 0.35s ease;
  }
  nav.primary a:hover::after{ right: 0; }
  .lang-switch{
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em;
    color: var(--ink); cursor: pointer; user-select: none;
    background: none; border: none; padding: 0;
  }
  .lang-switch [data-set-lang]{ cursor: pointer; }
  .lang-switch span.on{ font-weight: 500; }
  .lang-switch span.off{ color: var(--muted); }
  .lang-switch .sep{ color: var(--muted); margin: 0 6px; }

  /* page head */
  section.page-head{
    padding: 80px 0 48px;
    border-bottom: 1px solid var(--hair);
  }
  .page-head .num{
    font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted);
    margin: 0 0 16px;
  }
  .page-head h1{
    font-family: var(--serif-en); font-weight: 400;
    font-size: clamp(36px, 5vw, 56px);
    margin: 0; letter-spacing: -0.01em; line-height: 1.05;
  }
  body:not([data-lang="en"]) .page-head h1{ font-family: var(--serif-zh); }
  .page-head h1 em{ font-style: italic; color: var(--ink-soft); display: block; font-size: 0.42em; letter-spacing: 0.04em; margin-top: 10px; }
  .page-head .back{
    margin-top: 24px;
    font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.18em; text-transform: uppercase;
  }

  /* year groups */
  section.archive{ padding: 64px 0 96px; }
  .year-group{ margin-bottom: 64px; }
  .year-group h2{
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 22px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--hair-strong);
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .year-group h2 .count{ color: var(--muted); font-size: 10px; }

  .videos-grid{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 36px 28px;
  }
  @media (max-width: 900px){ .videos-grid{ grid-template-columns: repeat(2,1fr); } }
  @media (max-width: 600px){ .videos-grid{ grid-template-columns: 1fr; } }

  a.video-card{ display: block; color: inherit; }
  a.video-card:hover .thumb{ opacity: 0.86; transition: opacity 0.35s ease; }
  .video-card figure{ margin: 0; }
  .video-card .thumb{
    aspect-ratio: 16 / 9;
    background: var(--paper-2);
    position: relative; overflow: hidden;
  }
  .video-card .thumb img{
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .video-card .thumb .dur{
    position: absolute; right: 10px; top: 10px;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em;
    color: var(--ink); background: var(--paper); padding: 3px 8px;
  }
  .video-card figcaption{ padding: 14px 0 0; }
  .video-card .meta{
    font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 6px;
    display: flex; justify-content: space-between;
  }
  .video-card h4{
    font-family: var(--serif-en); font-weight: 400; font-size: 19px;
    margin: 0 0 4px; letter-spacing: -0.005em; line-height: 1.25;
  }
  body:not([data-lang="en"]) .video-card h4{ font-family: var(--serif-zh); }
  .video-card h4 em{ font-style: italic; color: var(--ink-soft); }
  .video-card .alt{
    font-family: var(--serif-en); font-style: italic;
    color: var(--muted); font-size: 13px; margin: 0;
  }
  body:not([data-lang="en"]) .video-card .alt{ font-family: var(--serif-zh); font-style: normal; }

  /* placeholder for missing thumbs */
  .hatch{
    background-image:
      repeating-linear-gradient(135deg, rgba(20,20,19,0.07) 0 1px, transparent 1px 9px),
      linear-gradient(#eeeeec, #eeeeec);
  }

  footer.site{
    border-top: 1px solid var(--hair);
    padding: 24px 0 32px;
    font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
  }
  footer.site .row{ display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
</style>
</head>

-->

<script>
  // Header language toggle
  (function(){
    const btn = document.getElementById('lang-toggle');
    const z = btn.querySelector('.z'); const e = btn.querySelector('.e'); const j = btn.querySelector('.j');
    const ORDER = ['zh','en','ja'];
    function paint(lang){
      z.classList.toggle('on', lang === 'zh');
      z.classList.toggle('off', lang !== 'zh');
      e.classList.toggle('on', lang === 'en');
      e.classList.toggle('off', lang !== 'en');
      j.classList.toggle('on', lang === 'ja');
      j.classList.toggle('off', lang !== 'ja');
    }
    function set(lang){
      document.body.dataset.lang = lang;
      document.documentElement.lang = lang;
      paint(lang);
      try{ localStorage.setItem('yl-lang', lang); }catch(e){}
    }
    const saved = (function(){ try{ return localStorage.getItem('yl-lang'); }catch(e){ return null; } })();
    set(saved || 'zh');
    btn.querySelectorAll('[data-set-lang]').forEach((el) => {
      el.addEventListener('click', () => set(el.dataset.setLang));
      el.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); set(el.dataset.setLang); }
      });
    });
  })();

  // Render archive: parse JSON, sort by date desc, group by year
  (function(){
    const data = JSON.parse(document.getElementById('videos-data').textContent);
    const sorted = [...data].sort((a,b) => (b.date || '').localeCompare(a.date || ''));

    const groups = new Map();
    for (const item of sorted) {
      const yr = (item.date || '').slice(0, 4) || '—';
      if (!groups.has(yr)) groups.set(yr, []);
      groups.get(yr).push(item);
    }

    const root = document.getElementById('archive-root');
    const esc = (s) => String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

    let html = '';
    for (const [year, items] of groups) {
      html += `<div class="year-group">
        <h2><span>${esc(year)}</span><span class="count">${items.length} ${items.length === 1 ? 'work' : 'works'}</span></h2>
        <div class="videos-grid">`;
      for (const it of items) {
        const month = (it.date || '').slice(5, 7);
        const dateLabel = year + (month ? ' · ' + month : '');
        const thumbHtml = it.thumb
          ? `<div class="thumb"><img src="${esc(it.thumb)}" alt="" loading="lazy"/><span class="dur">${esc(it.dur)}</span></div>`
          : `<div class="thumb hatch"><span class="dur">${esc(it.dur)}</span></div>`;
        const titleZH = esc(it.titleZH || '');
        const titleEN = esc(it.titleEN || it.titleZH || '');
        const titleJA = esc(it.titleJA || it.titleZH || '');
        const altZH = esc(it.altZH || '');
        const altEN = esc(it.altEN || '');
        const altJA = esc(it.altJA || it.altZH || '');
        const catZH = esc(it.category || '');
        const catEN = esc(it.categoryEN || it.category || '');
        const catJA = esc(it.categoryJA || it.category || '');
        html += `<a class="video-card" href="${esc(it.href || '#')}">
          <figure>
            ${thumbHtml}
            <figcaption>
              <div class="meta">
                <span>${esc(dateLabel)}</span>
                <span><span data-zh>${catZH}</span><span data-ja>${catJA}</span><span data-en>${catEN}</span></span>
              </div>
              <h4><span data-zh>${titleZH}</span><span data-ja>${titleJA}</span><span data-en><em>${titleEN}</em></span></h4>
              <p class="alt"><span data-zh>${altZH}</span><span data-ja>${altJA}</span><span data-en>${altEN}</span></p>
            </figcaption>
          </figure>
        </a>`;
      }
      html += '</div></div>';
    }
    root.innerHTML = html;
  })();
</script>
